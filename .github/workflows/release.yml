name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and publishes it to GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        shell: bash
        run: |
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$app" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version $app in src-tauri/tauri.conf.json (and Cargo.toml / package.json)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy

      # Models and the Real-ESRGAN sidecar are downloaded here, pinned by SHA-256. They are not in the repo.
      - uses: actions/cache@v4
        with:
          path: .asset-cache
          key: assets-${{ hashFiles('scripts/fetch_assets.py') }}
      - run: python scripts/fetch_assets.py

      - run: npm ci

      - name: Build and publish (with CodeFormer)
        id: with_faces
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: pixelforge ${{ github.ref_name }}
          releaseBody: "Instalador de Windows. Descarga el archivo `-setup.exe`, ejecútalo y listo: todo funciona sin conexión."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # Safety net: if the ONNX Runtime build breaks, still ship an installer without face restoration
      # and say so loudly, instead of publishing nothing.
      - name: Build and publish (without CodeFormer)
        if: steps.with_faces.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: pixelforge ${{ github.ref_name }}
          releaseBody: "Instalador de Windows (esta compilación no incluye la restauración de caras con CodeFormer)."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis -- --no-default-features

      - name: Warn when the fallback was used
        if: steps.with_faces.outcome == 'failure'
        shell: bash
        run: echo "::warning::The CodeFormer build failed; the published installer has no face restoration. Check the 'with CodeFormer' step logs."

  # Phase 2 (Android APK) will add a job here: Tauri 2 mobile build, signed with a debug keystore
  # generated in the workflow, uploaded to the same release.
