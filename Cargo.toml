[workspace]
resolver = "2"
members = ["crates/pixelforge-core", "src-tauri"]

[profile.dev]
opt-level = 1

# Pixel loops are unusably slow at opt-level 0, so dependencies are always optimized.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
