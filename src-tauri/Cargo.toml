[package]
name = "pixelforge"
version = "0.1.0"
description = "Local, offline photo enhancement for compressed images"
authors = ["oriioll"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "pixelforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pixelforge-core = { path = "../crates/pixelforge-core" }

[features]
default = ["codeformer"]
# Face restoration (CodeFormer + SCRFD through ONNX Runtime). Disable with --no-default-features.
codeformer = ["pixelforge-core/codeformer"]
